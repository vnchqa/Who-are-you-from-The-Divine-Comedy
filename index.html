    document.getElementById('intro').classList.add('hide');

    document.getElementById('result').classList.add('hide');

    document.getElementById('quiz').classList.remove('hide');

    totals={};

    data.results.forEach(r=>{
        totals[r.name]=0;
    });

    index=0;

    render();
}


function render(){

    let q=data.questions[index];

    document.getElementById('qnum').textContent=
        'Вопрос '+(index+1)+' из '+data.questions.length;

    document.getElementById('bar').style.width=
        (index/data.questions.length*100)+'%';

    document.getElementById('question').textContent=
        q.question;

    let box=document.getElementById('options');

    box.innerHTML='';

    q.options.forEach(o=>{

        let b=document.createElement('button');

        b.className='option';

        b.textContent=o.text;

        b.onclick=()=>answer(o);

        box.appendChild(b);

    });
}


function answer(o){

    document.querySelectorAll('.option').forEach(b=>{
        b.disabled=true;
    });

    Object.entries(o.scores).forEach(([n,p])=>{
        totals[n]+=p;
    });

    setTimeout(()=>{

        index++;

        if(index<data.questions.length){
            render();
        }else{
            finish();
        }

    },180);
}


function finish(){

    document.getElementById('quiz').classList.add('hide');

    document.getElementById('result').classList.remove('hide');

    let max=Math.max(...Object.values(totals));

    let winner=Object.keys(totals).find(
        n=>totals[n]===max
    );

    let r=data.results.find(
        x=>x.name===winner
    );

    document.getElementById('resultName').textContent=
        'Ты, '+winner;

    document.getElementById('resultDesc').textContent=
        r.description;
}

</script>

</body>
</html>
